name: Daily VOC Analysis

on:
  schedule:
    - cron: '0 1 * * *'   # 매일 KST 10:00 (UTC 01:00)
  workflow_dispatch:        # 수동 실행 허용
    inputs:
      domain:
        description: '분석할 도메인 (비워두면 game+health 전체 실행)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - game
          - health
      days:
        description: '수집할 리뷰 기간 (일)'
        required: false
        default: '30'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # data/reviews.csv 자동 커밋용

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (game + health)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.domain }}" ]; then
            ARGS="$ARGS --domain ${{ inputs.domain }}"
          fi
          ARGS="$ARGS --days ${{ inputs.days || '30' }}"
          # --domain 없이 실행하면 main.py가 config.DOMAINS 순서(game → health)대로
          # 한 프로세스 안에서 순차 수집·분석·저장하고 브리핑도 한 번만 보낸다.
          python main.py $ARGS

      - name: Generate top_issues.csv
        run: python extract_top_issues.py

      - name: Generate dashboard HTML
        run: python generate_dashboard.py

      - name: Commit updated CSV and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reviews.csv data/top_issues.csv docs/
          git diff --cached --quiet || git commit -m "data: update reviews.csv + dashboard [$(date +%Y-%m-%d)]"
          git pull --rebase origin main
          git push
