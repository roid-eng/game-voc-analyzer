<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>헬스 VOC 분석 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
header { padding: 24px 32px; border-bottom: 1px solid #1e293b; }
.back-link { display: inline-block; color: #38bdf8; font-size: 0.85rem; text-decoration: none; margin-bottom: 8px; }
.back-link:hover { text-decoration: underline; }
header h1 { font-size: 1.5rem; font-weight: 700; }
header p { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }
.row { display: grid; gap: 16px; margin-bottom: 24px; }
.row-cards { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.row-1 { grid-template-columns: 1fr; }
.row-2 { grid-template-columns: 1fr 1fr; }
.card { background: #1e293b; border-radius: 12px; padding: 20px; }
.card h2 { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
.risk-value { font-size: 2.2rem; font-weight: 800; }
.stat-value { font-size: 2.5rem; font-weight: 800; color: #38bdf8; }
.chart-wrap { position: relative; height: 260px; }
.chart-wrap-lg { position: relative; height: 300px; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th { text-align: left; padding: 10px 12px; background: #0f172a; color: #94a3b8; font-weight: 600; }
td { padding: 10px 12px; border-top: 1px solid #0f172a; vertical-align: top; }
tr:hover td { background: #263348; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; }
.p5 { background: #450a0a; color: #fca5a5; }
.p4 { background: #431407; color: #fdba74; }
.empty { text-align: center; color: #64748b; padding: 24px; }
@media (max-width: 768px) {
  .row-2 { grid-template-columns: 1fr; }
  .container { padding: 16px; }
}
</style>
</head>
<body>
<header>
  <a class="back-link" href="../index.html">← 홈</a>
  <h1>💊 헬스 VOC 분석 대시보드</h1>
  <p>마지막 업데이트: 2026-10-04 &nbsp;|&nbsp; 삼성헬스</p>
</header>
<div class="container">

  <!-- Row 1: 요약 카드 -->
  <div class="row row-cards">
    <div class="card">
      <h2>삼성헬스 위험등급</h2>
      <div class="risk-value" style="color:#f59e0b">MID</div>
    </div>
    <div class="card">
      <h2>이번 주 총 리뷰</h2>
      <div class="stat-value">20건</div>
    </div>
  </div>

  <!-- Row 2: 일별 트렌드 -->
  <div class="row row-1">
    <div class="card">
      <h2>최근 30일 일별 리뷰 추이</h2>
      <div class="chart-wrap-lg"><canvas id="trendChart"></canvas></div>
    </div>
  </div>

  <!-- Row 3: 파이 차트 -->
  <div class="row row-2">
    <div class="card">
      <h2>카테고리 분포 (전체)</h2>
      <div class="chart-wrap"><canvas id="categoryChart"></canvas></div>
    </div>
    <div class="card">
      <h2>감성 분포 (전체)</h2>
      <div class="chart-wrap"><canvas id="sentimentChart"></canvas></div>
    </div>
  </div>

  <!-- Row 4: 막대 차트 -->
  <div class="row row-2">
    <div class="card">
      <h2>앱별 카테고리 비교</h2>
      <div class="chart-wrap"><canvas id="appCategoryChart"></canvas></div>
    </div>
    <div class="card">
      <h2>긴급도별 분포</h2>
      <div class="chart-wrap"><canvas id="priorityChart"></canvas></div>
    </div>
  </div>

  <!-- Row 5: 긴급 이슈 테이블 -->
  <div class="row row-1">
    <div class="card">
      <h2>이번 주 긴급 이슈 (긴급도 4~5)</h2>
      <table>
        <thead>
          <tr>
            <th>앱</th><th>카테고리</th><th>긴급도</th><th>요약</th><th>키워드</th>
          </tr>
        </thead>
        <tbody id="urgentBody"></tbody>
      </table>
    </div>
  </div>

</div>
<script>
const D = {"updated": "2026-10-04", "apps": {"samsung_health": "삼성헬스"}, "risk": {"samsung_health": "MID"}, "week_total": 20, "total": 208, "trend": {"dates": ["2026-09-05", "2026-09-06", "2026-09-07", "2026-09-08", "2026-09-09", "2026-09-10", "2026-09-11", "2026-09-12", "2026-09-13", "2026-09-14", "2026-09-15", "2026-09-16", "2026-09-17", "2026-09-18", "2026-09-19", "2026-09-20", "2026-09-21", "2026-09-22", "2026-09-23", "2026-09-24", "2026-09-25", "2026-09-26", "2026-09-27", "2026-09-28", "2026-09-29", "2026-09-30", "2026-10-01", "2026-10-02", "2026-10-03", "2026-10-04"], "series": {"samsung_health": [4, 7, 5, 4, 5, 2, 2, 4, 3, 3, 1, 6, 4, 3, 1, 1, 2, 4, 3, 2, 2, 1, 4, 2, 3, 3, 4, 3, 1, 0]}}, "category": {"labels": ["UX/UI", "앱안정성", "데이터정확도", "운영대응", "알림개인정보"], "values": [104, 54, 46, 2, 2]}, "sentiment": {"labels": ["긍정", "부정", "중립"], "values": [59, 134, 15]}, "app_category": {"labels": ["데이터정확도", "앱안정성", "UX/UI", "알림개인정보", "운영대응"], "series": {"samsung_health": [46, 54, 104, 2, 2]}}, "priority": {"labels": ["긴급도 1", "긴급도 2", "긴급도 3", "긴급도 4", "긴급도 5"], "values": [45, 21, 35, 49, 58]}, "urgent_table": [{"app": "삼성헬스", "category": "앱안정성", "summary": "잠자는 동안 5시간에 3.5% 배터리가 소모되는 비정상적인 배터리 사용량을 겪고 있다.", "keywords": "배터리, 소모, 비정상", "priority": 5}, {"app": "삼성헬스", "category": "데이터정확도", "summary": "수면 측정이 정확히 기록되지 않아 수면 기록이 누락되고 포인트를 못 받아 스트레스를 받고 있다.", "keywords": "수면측정, 기록누락, 스트레스", "priority": 5}, {"app": "삼성헬스", "category": "앱안정성", "summary": "앱을 실행하면 로딩 화면만 지속되어 진입이 불가능하고, 데이터 손실이 우려된다.", "keywords": "앱실행불가, 로딩, 데이터손실", "priority": 5}, {"app": "삼성헬스", "category": "앱안정성", "summary": "핏3 달리기 기록이 갑자기 동기화되지 않음", "keywords": "핏3,동기화,오류", "priority": 5}, {"app": "삼성헬스", "category": "UX/UI", "summary": "앱 사용을 시작할 때부터 에버랜드 앱 설치를 강제한다는 점에 불만을 표시한다.", "keywords": "강제설치, 불편, 짜증", "priority": 5}, {"app": "삼성헬스", "category": "데이터정확도", "summary": "런닝머신에서 운동 시 측정이 되지 않아 정확도 문제를 제기한다.", "keywords": "런닝머신, 측정오류, 자동측정", "priority": 5}, {"app": "삼성헬스", "category": "앱안정성", "summary": "최근 업데이트 후 하이킹 경로를 표시하는 지도가 전혀 나타나지 않는다.", "keywords": "지도, 업데이트, 하이킹", "priority": 4}, {"app": "삼성헬스", "category": "데이터정확도", "summary": "운동 기록(걸음수·거리)이 비현실적으로 높아 데이터 정확성에 의문을 제기함", "keywords": "걸음수,거리,데이터정확도", "priority": 4}]};
const PALETTE = ["#f472b6", "#38bdf8", "#34d399", "#fbbf24", "#a78bfa", "#f87171"];
const GRID = '#263348';
Chart.defaults.color = '#94a3b8';
Chart.defaults.font.family = "'Segoe UI', sans-serif";

// 트렌드
const trendDatasets = Object.entries(D.trend.series).map(([key, data], i) => ({
  label: D.apps[key] || key,
  data,
  borderColor: PALETTE[i % PALETTE.length],
  backgroundColor: PALETTE[i % PALETTE.length] + '14',
  tension: 0.3, fill: true, pointRadius: 3
}));
new Chart(document.getElementById('trendChart'), {
  type: 'line',
  data: { labels: D.trend.dates, datasets: trendDatasets },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { position: 'top' } },
    scales: {
      x: { grid: { color: GRID }, ticks: { maxTicksLimit: 10 } },
      y: { grid: { color: GRID }, beginAtZero: true }
    }
  }
});

// 카테고리 도넛
new Chart(document.getElementById('categoryChart'), {
  type: 'doughnut',
  data: {
    labels: D.category.labels,
    datasets: [{ data: D.category.values, backgroundColor: PALETTE.concat(['#818cf8','#64748b']) }]
  },
  options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
});

// 감성 도넛
new Chart(document.getElementById('sentimentChart'), {
  type: 'doughnut',
  data: {
    labels: D.sentiment.labels,
    datasets: [{ data: D.sentiment.values, backgroundColor: ['#f87171','#94a3b8','#34d399','#64748b'] }]
  },
  options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
});

// 앱별 카테고리 막대
const appCategoryDatasets = Object.entries(D.app_category.series).map(([key, data], i) => ({
  label: D.apps[key] || key,
  data,
  backgroundColor: PALETTE[i % PALETTE.length]
}));
new Chart(document.getElementById('appCategoryChart'), {
  type: 'bar',
  data: { labels: D.app_category.labels, datasets: appCategoryDatasets },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { position: 'top' } },
    scales: { x: { grid: { color: GRID } }, y: { grid: { color: GRID }, beginAtZero: true } }
  }
});

// 긴급도 막대
new Chart(document.getElementById('priorityChart'), {
  type: 'bar',
  data: {
    labels: D.priority.labels,
    datasets: [{ label: '건수', data: D.priority.values, backgroundColor: ['#34d399','#6ee7b7','#fbbf24','#f97316','#ef4444'] }]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: { x: { grid: { color: GRID } }, y: { grid: { color: GRID }, beginAtZero: true } }
  }
});

// 긴급 이슈 테이블
const tbody = document.getElementById('urgentBody');
if (D.urgent_table.length === 0) {
  tbody.innerHTML = '<tr><td colspan="5" class="empty">이번 주 긴급 이슈 없음</td></tr>';
} else {
  D.urgent_table.forEach(r => {
    const cls = r.priority === 5 ? 'p5' : 'p4';
    tbody.innerHTML += `<tr>
      <td>${r.app}</td>
      <td>${r.category}</td>
      <td><span class="badge ${cls}">${r.priority}</span></td>
      <td>${r.summary}</td>
      <td style="color:#94a3b8;font-size:0.8rem">${r.keywords}</td>
    </tr>`;
  });
}
</script>
</body>
</html>
