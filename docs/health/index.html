<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>헬스 VOC 분석 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
header { padding: 24px 32px; border-bottom: 1px solid #1e293b; }
.back-link { display: inline-block; color: #38bdf8; font-size: 0.85rem; text-decoration: none; margin-bottom: 8px; }
.back-link:hover { text-decoration: underline; }
header h1 { font-size: 1.5rem; font-weight: 700; }
header p { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }
.row { display: grid; gap: 16px; margin-bottom: 24px; }
.row-cards { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.row-1 { grid-template-columns: 1fr; }
.row-2 { grid-template-columns: 1fr 1fr; }
.card { background: #1e293b; border-radius: 12px; padding: 20px; }
.card h2 { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
.risk-value { font-size: 2.2rem; font-weight: 800; }
.stat-value { font-size: 2.5rem; font-weight: 800; color: #38bdf8; }
.chart-wrap { position: relative; height: 260px; }
.chart-wrap-lg { position: relative; height: 300px; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th { text-align: left; padding: 10px 12px; background: #0f172a; color: #94a3b8; font-weight: 600; }
td { padding: 10px 12px; border-top: 1px solid #0f172a; vertical-align: top; }
tr:hover td { background: #263348; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; }
.p5 { background: #450a0a; color: #fca5a5; }
.p4 { background: #431407; color: #fdba74; }
.empty { text-align: center; color: #64748b; padding: 24px; }
@media (max-width: 768px) {
  .row-2 { grid-template-columns: 1fr; }
  .container { padding: 16px; }
}
</style>
</head>
<body>
<header>
  <a class="back-link" href="../index.html">← 홈</a>
  <h1>💊 헬스 VOC 분석 대시보드</h1>
  <p>마지막 업데이트: 2026-09-13 &nbsp;|&nbsp; 삼성헬스</p>
</header>
<div class="container">

  <!-- Row 1: 요약 카드 -->
  <div class="row row-cards">
    <div class="card">
      <h2>삼성헬스 위험등급</h2>
      <div class="risk-value" style="color:#f59e0b">MID</div>
    </div>
    <div class="card">
      <h2>이번 주 총 리뷰</h2>
      <div class="stat-value">28건</div>
    </div>
  </div>

  <!-- Row 2: 일별 트렌드 -->
  <div class="row row-1">
    <div class="card">
      <h2>최근 30일 일별 리뷰 추이</h2>
      <div class="chart-wrap-lg"><canvas id="trendChart"></canvas></div>
    </div>
  </div>

  <!-- Row 3: 파이 차트 -->
  <div class="row row-2">
    <div class="card">
      <h2>카테고리 분포 (전체)</h2>
      <div class="chart-wrap"><canvas id="categoryChart"></canvas></div>
    </div>
    <div class="card">
      <h2>감성 분포 (전체)</h2>
      <div class="chart-wrap"><canvas id="sentimentChart"></canvas></div>
    </div>
  </div>

  <!-- Row 4: 막대 차트 -->
  <div class="row row-2">
    <div class="card">
      <h2>앱별 카테고리 비교</h2>
      <div class="chart-wrap"><canvas id="appCategoryChart"></canvas></div>
    </div>
    <div class="card">
      <h2>긴급도별 분포</h2>
      <div class="chart-wrap"><canvas id="priorityChart"></canvas></div>
    </div>
  </div>

  <!-- Row 5: 긴급 이슈 테이블 -->
  <div class="row row-1">
    <div class="card">
      <h2>이번 주 긴급 이슈 (긴급도 4~5)</h2>
      <table>
        <thead>
          <tr>
            <th>앱</th><th>카테고리</th><th>긴급도</th><th>요약</th><th>키워드</th>
          </tr>
        </thead>
        <tbody id="urgentBody"></tbody>
      </table>
    </div>
  </div>

</div>
<script>
const D = {"updated": "2026-09-13", "apps": {"samsung_health": "삼성헬스"}, "risk": {"samsung_health": "MID"}, "week_total": 28, "total": 151, "trend": {"dates": ["2026-08-15", "2026-08-16", "2026-08-17", "2026-08-18", "2026-08-19", "2026-08-20", "2026-08-21", "2026-08-22", "2026-08-23", "2026-08-24", "2026-08-25", "2026-08-26", "2026-08-27", "2026-08-28", "2026-08-29", "2026-08-30", "2026-08-31", "2026-09-01", "2026-09-02", "2026-09-03", "2026-09-04", "2026-09-05", "2026-09-06", "2026-09-07", "2026-09-08", "2026-09-09", "2026-09-10", "2026-09-11", "2026-09-12", "2026-09-13"], "series": {"samsung_health": [9, 6, 7, 5, 4, 6, 8, 5, 6, 4, 8, 5, 6, 3, 5, 9, 5, 8, 3, 4, 3, 4, 7, 5, 4, 5, 2, 2, 3, 0]}}, "category": {"labels": ["UX/UI", "앱안정성", "데이터정확도", "운영대응", "알림개인정보"], "values": [79, 36, 33, 1, 2]}, "sentiment": {"labels": ["긍정", "부정", "중립"], "values": [48, 93, 10]}, "app_category": {"labels": ["데이터정확도", "앱안정성", "UX/UI", "구독과금", "알림개인정보", "운영대응"], "series": {"samsung_health": [33, 36, 79, 0, 2, 1]}}, "priority": {"labels": ["긴급도 1", "긴급도 2", "긴급도 3", "긴급도 4", "긴급도 5"], "values": [35, 16, 25, 33, 42]}, "urgent_table": [{"app": "삼성헬스", "category": "앱안정성", "summary": "챌린지 신청 페이지가 무한 로딩 상태로 멈춰 해결 방법을 요청하고 있습니다.", "keywords": "챌린지, 무한로딩, 오류", "priority": 5}, {"app": "삼성헬스", "category": "데이터정확도", "summary": "걸음수 체크가 간헐적으로 안 되고 삼성헬스와 연동도 실패해 재부팅이 필요합니다.", "keywords": "걸음수, 연동, 오류", "priority": 5}, {"app": "삼성헬스", "category": "앱안정성", "summary": "업데이트 후 측정값 오류와 로그인·회원탈퇴·로그아웃 문제, 이메일 인증 후 앱이 자동 종료됩니다.", "keywords": "앱 자동 종료, 로그인 문제, 측정 오류", "priority": 5}, {"app": "삼성헬스", "category": "앱안정성", "summary": "갤럭시24 울트라 업데이트 후 앱이 모든 버튼 클릭 시 종료되어 진입이 불가능합니다.", "keywords": "앱 크래시, 업데이트, 진입 불가", "priority": 5}, {"app": "삼성헬스", "category": "데이터정확도", "summary": "실외자전거 운동 시 거리 기록이 되지 않고 시간·위치만 저장되는 버그가 발생함", "keywords": "거리, 버그, 실외자전거", "priority": 5}, {"app": "삼성헬스", "category": "데이터정확도", "summary": "일일 걸음 수가 실제와 크게 차이 나 정확하지 않다며 개선을 요구", "keywords": "걸음수, 부정확, 조치요구", "priority": 5}, {"app": "삼성헬스", "category": "데이터정확도", "summary": "수면시간을 입력하면 시간과 날짜가 자동으로 바뀌어 저장이 불가능합니다.", "keywords": "수면시간, 오류, 저장불가", "priority": 5}, {"app": "삼성헬스", "category": "데이터정확도", "summary": "같은 거리를 뛰어도 보폭 수가 매일 다르게 측정돼 정확성이 떨어집니다.", "keywords": "거리측정, 불일치, 보폭", "priority": 5}, {"app": "삼성헬스", "category": "데이터정확도", "summary": "업데이트 후 달리기 페이스가 실제보다 오래 걸리게 기록돼 정확도가 감소했습니다.", "keywords": "업데이트, 페이스, 부정확", "priority": 5}, {"app": "삼성헬스", "category": "데이터정확도", "summary": "거리 측정이 500m를 1km로 과대 인식하는 등 심각한 오류가 지속됩니다.", "keywords": "거리측정, 과대인식, 오류", "priority": 5}, {"app": "삼성헬스", "category": "앱안정성", "summary": "앱이 갑자기 열리지 않아 사용할 수 없습니다.", "keywords": "앱 실행, 오류, 갑작스러운", "priority": 5}, {"app": "삼성헬스", "category": "데이터정확도", "summary": "GPS 위치 측정과 일시정지 기능이 지속적으로 부정확하게 동작합니다.", "keywords": "GPS, 일시정지, 오류", "priority": 4}, {"app": "삼성헬스", "category": "UX/UI", "summary": "업그레이드 후 혈압 입력과 걷기 지도 등 UI가 복잡해져 사용이 불편해졌습니다.", "keywords": "UI 복잡, 혈압 입력, 지도", "priority": 4}, {"app": "삼성헬스", "category": "UX/UI", "summary": "업데이트 후 달리기 화면에서 지도 기능이 사라져 사용에 불편을 겪고 있음", "keywords": "지도, 달리기, 업데이트", "priority": 4}, {"app": "삼성헬스", "category": "데이터정확도", "summary": "버전 업데이트 후 월별 평균 체중 계산이 잘못되어 그래프와 평균값이 부정확하게 표시됩니다.", "keywords": "체중, 월별 평균, 통계", "priority": 4}, {"app": "삼성헬스", "category": "데이터정확도", "summary": "업데이트 후 러닝 거리 측정이 5km를 7km로 잘못 표시되는 오류가 발생했습니다.", "keywords": "러닝 거리, 측정 오류, 업데이트", "priority": 4}]};
const PALETTE = ["#f472b6", "#38bdf8", "#34d399", "#fbbf24", "#a78bfa", "#f87171"];
const GRID = '#263348';
Chart.defaults.color = '#94a3b8';
Chart.defaults.font.family = "'Segoe UI', sans-serif";

// 트렌드
const trendDatasets = Object.entries(D.trend.series).map(([key, data], i) => ({
  label: D.apps[key] || key,
  data,
  borderColor: PALETTE[i % PALETTE.length],
  backgroundColor: PALETTE[i % PALETTE.length] + '14',
  tension: 0.3, fill: true, pointRadius: 3
}));
new Chart(document.getElementById('trendChart'), {
  type: 'line',
  data: { labels: D.trend.dates, datasets: trendDatasets },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { position: 'top' } },
    scales: {
      x: { grid: { color: GRID }, ticks: { maxTicksLimit: 10 } },
      y: { grid: { color: GRID }, beginAtZero: true }
    }
  }
});

// 카테고리 도넛
new Chart(document.getElementById('categoryChart'), {
  type: 'doughnut',
  data: {
    labels: D.category.labels,
    datasets: [{ data: D.category.values, backgroundColor: PALETTE.concat(['#818cf8','#64748b']) }]
  },
  options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
});

// 감성 도넛
new Chart(document.getElementById('sentimentChart'), {
  type: 'doughnut',
  data: {
    labels: D.sentiment.labels,
    datasets: [{ data: D.sentiment.values, backgroundColor: ['#f87171','#94a3b8','#34d399','#64748b'] }]
  },
  options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
});

// 앱별 카테고리 막대
const appCategoryDatasets = Object.entries(D.app_category.series).map(([key, data], i) => ({
  label: D.apps[key] || key,
  data,
  backgroundColor: PALETTE[i % PALETTE.length]
}));
new Chart(document.getElementById('appCategoryChart'), {
  type: 'bar',
  data: { labels: D.app_category.labels, datasets: appCategoryDatasets },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { position: 'top' } },
    scales: { x: { grid: { color: GRID } }, y: { grid: { color: GRID }, beginAtZero: true } }
  }
});

// 긴급도 막대
new Chart(document.getElementById('priorityChart'), {
  type: 'bar',
  data: {
    labels: D.priority.labels,
    datasets: [{ label: '건수', data: D.priority.values, backgroundColor: ['#34d399','#6ee7b7','#fbbf24','#f97316','#ef4444'] }]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: { x: { grid: { color: GRID } }, y: { grid: { color: GRID }, beginAtZero: true } }
  }
});

// 긴급 이슈 테이블
const tbody = document.getElementById('urgentBody');
if (D.urgent_table.length === 0) {
  tbody.innerHTML = '<tr><td colspan="5" class="empty">이번 주 긴급 이슈 없음</td></tr>';
} else {
  D.urgent_table.forEach(r => {
    const cls = r.priority === 5 ? 'p5' : 'p4';
    tbody.innerHTML += `<tr>
      <td>${r.app}</td>
      <td>${r.category}</td>
      <td><span class="badge ${cls}">${r.priority}</span></td>
      <td>${r.summary}</td>
      <td style="color:#94a3b8;font-size:0.8rem">${r.keywords}</td>
    </tr>`;
  });
}
</script>
</body>
</html>
